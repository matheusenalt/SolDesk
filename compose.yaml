name: soldesk
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soldesk}
      POSTGRES_USER: ${POSTGRES_USER:-soldesk_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/setup.ps1 ou configure .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./backend
    command: [python, -m, app.manage, migrate]
    environment: &migration_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-soldesk_migrator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-soldesk}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-soldesk_migrator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-soldesk}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?Execute novamente o setup para gerar RUNTIME_PASSWORD}
      SOLDESK_MODE: ${SOLDESK_MODE:-community}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /home/soldesk/media
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://object-store:9000}
      S3_BUCKET: ${S3_BUCKET:-soldesk-private}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      DOWNLOAD_SIGNING_KEY: ${DOWNLOAD_SIGNING_KEY:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-mock}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      AUDIO_MAX_SECONDS: ${AUDIO_MAX_SECONDS:-600}
      AUDIO_JOB_TIMEOUT: ${AUDIO_JOB_TIMEOUT:-300}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  api:
    build: ./backend
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg://soldesk_runtime:${RUNTIME_PASSWORD}@db:5432/${POSTGRES_DB:-soldesk}
      SOLDESK_MODE: ${SOLDESK_MODE:-community}
      SOLDESK_INSTANCE_NAME: ${SOLDESK_INSTANCE_NAME:-Instância SolDesk}
      ALLOW_ORG_SIGNUP: ${ALLOW_ORG_SIGNUP:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /home/soldesk/media
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://object-store:9000}
      S3_BUCKET: ${S3_BUCKET:-soldesk-private}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      DOWNLOAD_SIGNING_KEY: ${DOWNLOAD_SIGNING_KEY:-}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-mock}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      AUDIO_MAX_SECONDS: ${AUDIO_MAX_SECONDS:-600}
      AUDIO_JOB_TIMEOUT: ${AUDIO_JOB_TIMEOUT:-300}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
    volumes: [media_data:/home/soldesk/media]
    ports:
      - '${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api-dev:
    profiles: [dev]
    build: ./backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --reload, --no-access-log]
    environment: *api_environment
    volumes:
      - ./backend/app:/app/app:ro
      - media_data:/home/soldesk/media
    depends_on:
      migrate:
        condition: service_completed_successfully
  web-dev:
    profiles: [dev]
    build:
      context: ./web
      target: development
    environment:
      API_PROXY_TARGET: http://api-dev:8000
    ports:
      - '127.0.0.1:${DEV_PORT:-5173}:5173'
    volumes:
      - ./web/src:/app/src:ro
      - ./web/index.html:/app/index.html:ro
      - ./web/public:/app/public:ro
    depends_on: [api-dev]
  test-db:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: soldesk_test
      POSTGRES_USER: soldesk_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U soldesk_migrator -d soldesk_test']
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    profiles: [test]
    build:
      context: ./backend
      target: worker
    command: [python, -m, pytest, tests, -q, -p, 'no:cacheprovider']
    environment:
      DATABASE_URL: postgresql+psycopg://soldesk_runtime:${RUNTIME_PASSWORD}@test-db:5432/soldesk_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://soldesk_migrator:${POSTGRES_PASSWORD}@test-db:5432/soldesk_test
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD}
      ENVIRONMENT: test
      SOLDESK_MODE: cloud
      CORS_ORIGINS: http://testserver
      REDIS_URL: redis://test-redis:6379/0
      STORAGE_LOCAL_DIR: /tmp/soldesk-test-media
    volumes:
      - ./backend/tests:/app/tests:ro
      - ./backend/app:/app/app:ro
      - ./backend/migrations:/app/migrations:ro
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
  test-redis:
    profiles: [test]
    image: redis:8-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  worker:
    build:
      context: ./backend
      target: worker
    environment: *api_environment
    volumes: [media_data:/home/soldesk/media:ro]
    tmpfs: [/tmp:size=128m]
    mem_limit: 768m
    cpus: 2
    read_only: true
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.media_worker, health]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  dispatcher:
    build: ./backend
    command: [python, -m, app.media_worker, dispatcher]
    environment: *api_environment
    volumes: [media_data:/home/soldesk/media]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker-whisper:
    profiles: [whisper]
    build:
      context: ./backend
      target: whisper
    environment:
      <<: *api_environment
      TRANSCRIPTION_PROVIDER: faster_whisper
      WHISPER_MODEL_PATH: /models/whisper
    volumes: [media_data:/home/soldesk/media:ro, './models:/models:ro']
    tmpfs: [/tmp:size=128m]
    mem_limit: 3g
    cpus: 2
    read_only: true
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.media_worker, health]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  s3-init:
    profiles: [s3]
    image: alpine:3.22
    volumes: [s3_data:/data]
    command: [chown, '10001:10001', /data]
    restart: 'no'
  object-store:
    profiles: [s3]
    image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    entrypoint: [/bin/sh]
    command: [-ec, 'test -n "$$RUSTFS_ACCESS_KEY" && test -n "$$RUSTFS_SECRET_KEY" && exec /etc/rustfs/entrypoint.sh rustfs']
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_OBS_LOG_DIRECTORY: /tmp/logs
    volumes: [s3_data:/data]
    tmpfs: [/tmp]
    depends_on:
      s3-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:9000/health']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  clamav:
    profiles: [antivirus]
    image: clamav/clamav:stable
    restart: unless-stopped
volumes:
  postgres_data:
  media_data:
  redis_data:
  s3_data:
