name: soldesk
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soldesk}
      POSTGRES_USER: ${POSTGRES_USER:-soldesk_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/setup.ps1 ou configure .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./backend
    command: [alembic, upgrade, head]
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-soldesk_migrator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-soldesk}
      SOLDESK_MODE: ${SOLDESK_MODE:-community}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  api:
    build: ./backend
    environment: *api_environment
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api-dev:
    profiles: [dev]
    build: ./backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --reload, --no-access-log]
    environment: *api_environment
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
  web-dev:
    profiles: [dev]
    build:
      context: ./web
      target: development
    environment:
      API_PROXY_TARGET: http://api-dev:8000
    ports:
      - '127.0.0.1:${DEV_PORT:-5173}:5173'
    volumes:
      - ./web/src:/app/src:ro
      - ./web/index.html:/app/index.html:ro
    depends_on: [api-dev]
volumes:
  postgres_data:
