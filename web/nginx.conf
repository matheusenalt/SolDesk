server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64m;
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Arquivo maior que o limite permitido","status":413}';
    }
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
